services:
  mysql:
    image: mysql:8.0
    container_name: smart-farming-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: smart_farming_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  smart-farming-ai:
    build:
      context: ./smart-farming-ai
      dockerfile: Dockerfile
    container_name: smart-farming-ai
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  smart-farming-backend:
    build:
      context: ./smart-farming-backend
      dockerfile: Dockerfile
    container_name: smart-farming-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/smart_farming_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - JWT_SECRET=${JWT_SECRET:-bXlfc3VwZXJfc2VjcmV0X2tleV9mb3Jfand0X2F1dGhlbnRpY2F0aW9uX3Rlc3Rpbmc=}
      - AI_SERVICE_URL=http://smart-farming-ai:8000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      mysql:
        condition: service_healthy
      smart-farming-ai:
        condition: service_healthy

volumes:
  mysql_data:
